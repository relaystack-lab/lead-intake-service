[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "lead-intake"
version = "0.1.0"
description = "Сервис приёма и учёта заявок для малого бизнеса"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "cryptography>=43,<47",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
lead-intake = "lead_intake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_intake"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --basetemp=.pytest_tmp"
cache_dir = ".pytest_cache"
pythonpath = ["src"]
testpaths = ["tests"]
tmp_path_retention_policy = "none"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
