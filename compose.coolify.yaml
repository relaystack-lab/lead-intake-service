name: lead-intake

services:
  volume-init:
    build: .
    user: "0:0"
    command:
      - sh
      - -c
      - mkdir -p /data /logs && chown -R 10001:10001 /data /logs
    volumes:
      - lead_intake_data:/data
      - lead_intake_logs:/logs
    restart: "no"

  app:
    build: .
    environment:
      DATABASE_URL: sqlite:////data/lead_intake.db
      LOG_DIRECTORY: /logs
      API_KEY: ${API_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SECRETS_KEY: ${SECRETS_KEY}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      volume-init:
        condition: service_completed_successfully
    expose:
      - "8000"
    volumes:
      - lead_intake_data:/data
      - lead_intake_logs:/logs
    restart: unless-stopped

volumes:
  lead_intake_data:
  lead_intake_logs: