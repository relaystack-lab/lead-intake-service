<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Lead Intake Service{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='admin.css') }}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="{{ url_for('static', path='admin.js') }}" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-content">
        <a class="brand" href="/admin/leads">Lead Intake Service</a>
        <nav class="admin-nav" aria-label="Административная навигация">
          <a class="{% if request.url.path.startswith('/admin/leads') %}is-active{% endif %}" href="/admin/leads" {% if request.url.path.startswith('/admin/leads') %}aria-current="page"{% endif %}>Заявки</a>
          <a class="{% if request.url.path.startswith('/admin/settings') %}is-active{% endif %}" href="/admin/settings" {% if request.url.path.startswith('/admin/settings') %}aria-current="page"{% endif %}>Уведомления</a>
        </nav>
      </div>
    </header>
    <main class="container page-content">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
